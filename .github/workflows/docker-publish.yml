name: Build & publish Docker image (manual fallback)

# MANUAL FALLBACK ONLY. The primary build path is now Tekton on the Civitai
# cluster: push a semver tag (`git tag vX.Y.Z && git push --tags`) → Flux
# GitRepository (semver) → Tekton `build-and-push` → ghcr.io/civitai/vitrine:
# `<14-digit-ts>-<shortsha>` → Flux ImagePolicy → rollout to vitrine.civitai.com.
#
# This workflow is retained as an escape hatch during the transfer/cutover to
# github.com/civitai/vitrine (e.g. if Tekton is unavailable). It only runs on
# manual dispatch — the automatic push-to-main trigger has been removed so it
# doesn't race Tekton. Builds + pushes ghcr.io/<owner>/vitrine with tags
# `<14-digit-ts>-<shortsha>` + `latest` using the default GITHUB_TOKEN.
#
# NOTE: after the first publish, flip the GHCR package visibility to PUBLIC
# (package settings) — the cluster pulls without credentials.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=https://vitrine.civitai.com
            S3_ENDPOINT=https://s3.us-west-004.backblazeb2.com
            S3_PUBLIC_URL=https://s3.us-west-004.backblazeb2.com
            NEXT_PUBLIC_FARO_URL=https://vitrine.civitai.com/faro
            NEXT_PUBLIC_FARO_APP_NAME=vitrine
            NEXT_PUBLIC_APP_VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/vitrine:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/vitrine:latest
